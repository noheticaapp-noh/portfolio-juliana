<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juliana Miranda — Portfolio</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="portfolio">

    <header class="portfolio-header">
      <h1>Juliana Miranda</h1>
      <p>Graphic Designer | Ui/Ux, Product Designer</p>
    </header>


    <!-- PROJETO 1 -->
    <section class="portfolio-row">

      <div class="project project-wide">
        <img src="assets/printsiteNoh1.png" alt="Projeto Nohética">
      </div>

      <div class="project project-tall">
        <img src="assets/macum.png" alt="Projeto da Macumbarteira">
      </div>

    </section>


    <!-- BLOCO DE TEXTO -->
    <section class="portfolio-row">

      <div class="text-card">
        <p>
          Design, tecnologia e experiências digitais pensadas para
          aproximar pessoas, produtos e ideias.
        </p>
      </div>

    </section>


    <!-- PROJETOS GRÁFICOS -->
    <section class="portfolio-row">

      <div class="project project-medium">
        <img src="assets/lacosdeafeto.png" alt="Projeto gráfico Laços de Afeto">
      </div>

      <div class="project project-medium">
        <img src="assets/livroeditorial2.png" alt="Projeto Editorial Livro">
      </div>

      <div class="project project-small">
        <img src="assets/poesias cavaleiro selvagem.gif" alt="Projeto de aquarela e editorial">
      </div>

    </section>


    <!-- PROJETOS DIGITAIS -->
    <section class="portfolio-row">

      <div class="project project-medium">
        <img src="assets/tf.png" alt="UI/UX TfSports">
      </div>

      <div class="project project-tall">
        <img src="assets/keymockup.gif" alt="Motion lottie">
      </div>


    </section>


    <!-- BLOCO DE TEXTO -->
    <section class="portfolio-row">

      <div class="text-card text-card-large">
        <p>
          Projetos que atravessam UX/UI, design de produto,
          identidade visual, ilustração e pesquisa.
        </p>
      </div>

    </section>


    <!-- OUTROS PROJETOS -->
    <section class="portfolio-row">

      <div class="project project-small">
        <img src="assets/projeto-9.jpg" alt="Projeto de identidade">
      </div>

      <div class="project project-small">
        <img src="assets/projeto-10.jpg" alt="Projeto de ilustração">
      </div>

      <div class="project project-medium">
        <img src="assets/projeto-11.jpg" alt="Projeto digital">
      </div>

    </section>


    <!-- PROJETOS FINAIS -->
    <section class="portfolio-row">

      <div class="project project-wide">
        <img src="assets/correasc.png" alt="Game Design, art Direction, UX">
      </div>

      <div class="project project-medium">
        <img src="assets/ru.png" alt="Rugido app design id">
      </div>

      <div class="project project-medium">
        <img src="assets/logoneon.png" alt="Visual Id, Branding">
      </div>

    </section>

</html>
