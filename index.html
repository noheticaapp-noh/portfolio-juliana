<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juliana Miranda — Portfolio</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="portfolio">

    <header class="portfolio-header">
      <h1>Juliana Miranda</h1>
    </header>


    <!-- PROJETO 1 -->
    <section class="portfolio-row">

      <div class="project project-wide">
        <img src="assets/printsiteNoh1.png" alt="Projeto Nohética">
      </div>

      <div class="project project-tall">
        <img src="assets/macum.png.jpg" alt="Projeto da Macumbarteira">
      </div>

    </section>


    <!-- BLOCO DE TEXTO -->
    <section class="portfolio-row">

      <div class="text-card">
        <p>
          Design, tecnologia e experiências digitais pensadas para
          aproximar pessoas, produtos e ideias.
        </p>
      </div>

    </section>


    <!-- PROJETOS GRÁFICOS -->
    <section class="portfolio-row">

      <div class="project project-medium">
        <img src="assets/projeto-3.jpg" alt="Projeto gráfico">
      </div>

      <div class="project project-medium">
        <img src="assets/projeto-4.jpg" alt="Projeto editorial">
      </div>

      <div class="project project-small">
        <img src="assets/projeto-5.jpg" alt="Projeto de design">
      </div>

    </section>


    <!-- PROJETOS DIGITAIS -->
    <section class="portfolio-row">

      <div class="project project-medium">
        <img src="assets/projeto-6.jpg" alt="Projeto digital">
      </div>

      <div class="project project-tall">
        <img src="assets/projeto-7.jpg" alt="Interface digital">
      </div>

      <div class="project project-small">
        <img src="assets/projeto-8.jpg" alt="Projeto de identidade visual">
      </div>

    </section>


    <!-- BLOCO DE TEXTO -->
    <section class="portfolio-row">

      <div class="text-card text-card-large">
        <p>
          Projetos que atravessam UX/UI, design de produto,
          identidade visual, ilustração e pesquisa.
        </p>
      </div>

    </section>


    <!-- OUTROS PROJETOS -->
    <section class="portfolio-row">

      <div class="project project-small">
        <img src="assets/projeto-9.jpg" alt="Projeto de identidade">
      </div>

      <div class="project project-small">
        <img src="assets/projeto-10.jpg" alt="Projeto de ilustração">
      </div>

      <div class="project project-medium">
        <img src="assets/projeto-11.jpg" alt="Projeto digital">
      </div>

    </section>


    <!-- PROJETOS FINAIS -->
    <section class="portfolio-row">

      <div class="project project-wide">
        <img src="assets/projeto-12.jpg" alt="Projeto de design">
      </div>

      <div class="project project-medium">
        <img src="assets/projeto-13.jpg" alt="Projeto gráfico">
      </div>

    </section>

  </main>

</html>
